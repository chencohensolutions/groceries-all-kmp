name: Android build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Shared unit tests
        run: ./gradlew :shared:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Rename APK
        run: cp androidApp/build/outputs/apk/debug/androidApp-debug.apk groceries-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: groceries-debug-apk
          path: groceries-debug.apk

      # A fixed download link for the phone: Releases → "latest-debug" → groceries-debug.apk
      - name: Publish to the latest-debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build
          prerelease: true
          body: "Debug APK from ${{ github.ref_name }} @ ${{ github.sha }}"
          files: groceries-debug.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: shared/build/reports/tests/
